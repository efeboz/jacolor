[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jacolor"
version = "0.1.0.dev0"
description = "Jacobian sparsity detection and coloring for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # 2.6 is the floor: export, run_decompositions and the core-ATen
    # decomposition table changed materially before it.
    "torch>=2.6",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
fast = ["numba>=0.59"]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "networkx>=3",
]

[tool.hatch.build.targets.wheel]
packages = ["jacolor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
