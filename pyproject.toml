[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jacolor"
version = "0.1.0.dev0"
description = "Jacobian sparsity detection and coloring for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # 2.6 is the floor: export, run_decompositions and the core-ATen
    # decomposition table changed materially before it.
    "torch>=2.6",
    "numpy>=1.24",
    "scipy>=1.14",  # 1.14.1 is the oldest the suite has passed on
]

[project.optional-dependencies]
fast = ["numba>=0.59"]
dev = [
    "pytest>=8",
    "networkx>=3",  # independent coloring reference
]

[tool.hatch.build.targets.wheel]
# Sources live flat in src/; the wheel ships them as the jacolor package.
# (This rename rules out `pip install -e .` -- hatchling refuses editable
# installs when a sources rewrite changes a prefix. Tests import from src.)
only-include = ["src"]
sources = { "src" = "jacolor" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# A test that leaves one of these unhandled is a test that does not know what it
# checked. The ones that expect them say so with pytest.warns.
filterwarnings = [
    "error::src.evaluate.VerificationInconclusive",
    "error::src.trace.TraceUnchecked",
]
