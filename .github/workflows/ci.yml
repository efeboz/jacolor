name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2.6 is the floor, latest is the moving target.
        python: ["3.10", "3.11", "3.12", "3.13"]
        torch: ["2.6.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.torch }}" = "latest" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            pip install "torch==${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -e ".[dev,fast]"
      - run: pytest -q

  no-numba:
    # The pure-Python greedy fallback has to keep working on its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: pytest -q
